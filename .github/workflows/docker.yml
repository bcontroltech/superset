name: Build & publish docker images to GHCR

on:
  push:
    branches:
      - "master"
      - "import-file"
      - "[0-9].[0-9]*"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches:
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:

  setup_matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix_config: ${{ steps.set_matrix.outputs.matrix_config }}
    steps:
      - id: set_matrix
        run: |
          MATRIX_CONFIG=$(if [ "${{ github.event_name }}" == "pull_request" ]; then echo '["dev", "lean"]'; else echo '["dev", "lean", "py310", "websocket", "dockerize", "py311", "py312"]'; fi)
          echo "matrix_config=${MATRIX_CONFIG}" >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT

  docker-build:
    name: docker-build
    needs: setup_matrix
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_preset: ${{fromJson(needs.setup_matrix.outputs.matrix_config)}}
      fail-fast: false
    env:
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/superset-bct:${{ matrix.build_preset }}-${{ github.run_id }}
      # Extract version from tag if this is a tag push
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.run_id }}

    steps:

      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Environment
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        uses: ./.github/actions/setup-docker
        with:
          build: "true"

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup supersetbot
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        uses: ./.github/actions/setup-supersetbot/

      - name: Build Docker Image
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single platform builds in pull_request context to speed things up
          if [ "${{ github.event_name }}" = "push" ]; then
            PLATFORM_ARG="--platform linux/arm64 --platform linux/amd64"
            # can only --load images in single-platform builds
            PUSH_OR_LOAD="--push"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PLATFORM_ARG="--platform linux/amd64"
            PUSH_OR_LOAD="--load"
          fi

          supersetbot docker \
            $PUSH_OR_LOAD \
            --preset ${{ matrix.build_preset }} \
            --context "$EVENT" \
            --context-ref "$RELEASE" $FORCE_LATEST \
            --extra-flags "--build-arg INCLUDE_CHROMIUM=false --tag $IMAGE_TAG --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            $PLATFORM_ARG

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker)
        run: |
          # Push the built image to GHCR
          docker push $IMAGE_TAG
          
          # Handle release tags (semantic versioning)
          if [[ "${{ github.ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION_TAG=ghcr.io/${{ github.repository_owner }}/superset-bct:${{ github.ref_name }}-${{ matrix.build_preset }}
            docker tag $IMAGE_TAG $VERSION_TAG
            docker push $VERSION_TAG
            
            # For dev preset, also tag without preset suffix for cleaner release tags
            if [ "${{ matrix.build_preset }}" = "dev" ]; then
              CLEAN_VERSION_TAG=ghcr.io/${{ github.repository_owner }}/superset-bct:${{ github.ref_name }}
              docker tag $IMAGE_TAG $CLEAN_VERSION_TAG
              docker push $CLEAN_VERSION_TAG
            fi
          fi
          
          # Tag as latest for the main branch builds (dev preset)
          if [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ matrix.build_preset }}" = "dev" ]; then
            GHCR_LATEST_TAG=ghcr.io/${{ github.repository_owner }}/superset-bct:latest
            docker tag $IMAGE_TAG $GHCR_LATEST_TAG
            docker push $GHCR_LATEST_TAG
          fi
          
          # Tag with branch name for feature branches
          if [[ "${{ github.ref }}" =~ ^refs/heads/ ]] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
            GHCR_BRANCH_TAG=ghcr.io/${{ github.repository_owner }}/superset-bct:${BRANCH_NAME}-${{ matrix.build_preset }}
            docker tag $IMAGE_TAG $GHCR_BRANCH_TAG
            docker push $GHCR_BRANCH_TAG
          fi

      - name: Print docker stats
        if: steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "IMAGE: $IMAGE_TAG"
          echo "REFERENCE: ${{ github.ref }}"
          echo "VERSION: $VERSION"
          docker images $IMAGE_TAG
          docker history $IMAGE_TAG

      - name: Output pushed image tags
        if: github.event_name == 'push' && (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker)
        run: |
          echo "## 🐳 Pushed Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Tag | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`$IMAGE_TAG\` | Build artifact |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "| GHCR | \`ghcr.io/${{ github.repository_owner }}/superset-bct:${{ github.ref_name }}-${{ matrix.build_preset }}\` | Release version |" >> $GITHUB_STEP_SUMMARY
            if [ "${{ matrix.build_preset }}" = "dev" ]; then
              echo "| GHCR | \`ghcr.io/${{ github.repository_owner }}/superset-bct:${{ github.ref_name }}\` | Clean release version |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          if [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ matrix.build_preset }}" = "dev" ]; then
            echo "| GHCR | \`ghcr.io/${{ github.repository_owner }}/superset-bct:latest\` | Latest stable |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: docker-compose sanity check
        if: (steps.check.outputs.python || steps.check.outputs.frontend || steps.check.outputs.docker) && matrix.build_preset == 'dev'
        shell: bash
        run: |
          export SUPERSET_BUILD_TARGET=${{ matrix.build_preset }}
          # This should reuse the CACHED image built in the previous steps
          docker compose build superset-init --build-arg DEV_MODE=false --build-arg INCLUDE_CHROMIUM=false
          docker compose up superset-init --exit-code-from superset-init

  docker-compose-image-tag:
    # Run this job only on pushes to master (not for PRs)
    # goal is to check that building the latest image works, not required for all PR pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Environment
        if: steps.check.outputs.docker
        uses: ./.github/actions/setup-docker
        with:
          build: "false"
          install-docker-compose: "true"
      - name: docker-compose sanity check
        if: steps.check.outputs.docker
        shell: bash
        run: |
          docker compose -f docker-compose-image-tag.yml up superset-init --exit-code-from superset-init
